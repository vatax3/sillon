name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - name: Worker (typecheck)
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          npm run typecheck

  deploy:
    name: Publication GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  docker:
    name: Image Docker
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Construction (amd64, pour le test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sillon:test
          build-args: SILLON_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name sillon -p 8080:8080 -e SPOTIFY_CLIENT_ID=test -e BASE_URL=http://127.0.0.1:8080 sillon:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/api/config | grep -q '"mode":"server"'
          curl -fs http://127.0.0.1:8080/ | grep -q '<title>Sillon'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/revs)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/auth/login)" = 302
          docker exec sillon test -f /data/sillon.db
          docker exec sillon sh -c 'test "$(id -un)" = node'
          docker logs sillon
          docker rm -f sillon
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication multi-architecture (amd64, arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SILLON_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
